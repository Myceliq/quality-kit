##
# quality-kit self-tests: the kit gates the fleet, so the kit itself is gated.
#
# Two of these suites exist because the kit once shipped files that failed its
# own gates — oxfmt-clean.test.sh and oxlint-clean.test.sh enforce the single
# invariant that the kit's own shipped files pass the kit's own checks.
##
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      # Install the pinned oxlint + oxfmt + ultracite so the config integration
      # tests EXECUTE here (OXLINT_BIN / OXFMT_BIN set) instead of skipping.
      # Uses a committed lockfile + `npm ci` for a reproducible, transitively
      # pinned tree (the step's node_modules/ is gitignored, so it doesn't touch
      # the working tree the kit tests operate on). Regenerate the lockfile when
      # ts/pins.json bumps oxlint, oxfmt or ultracite.
      - name: Install the oxlint toolchain for the config integration tests
        run: |
          cd ci/oxlint-toolchain
          npm ci --no-audit --no-fund
          echo "OXLINT_BIN=$PWD/node_modules/.bin/oxlint" >> "$GITHUB_ENV"
          echo "OXFMT_BIN=$PWD/node_modules/.bin/oxfmt" >> "$GITHUB_ENV"
      - name: Run all kit test suites
        run: |
          set -euo pipefail
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
          fail=0
          for t in hooks/hooks.test.sh \
                   hooks/git-pre-commit.test.sh \
                   hooks/hooks-doctor.test.sh \
                   bin/count-suppressions.test.sh \
                   bin/stamp.test.sh \
                   bin/check-drift.test.sh \
                   bin/render-ruff.test.sh \
                   bin/baseline-rules.test.sh \
                   bin/loc-budget.test.sh \
                   ts/oxlint-overrides.test.sh \
                   ts/oxfmt-clean.test.sh \
                   ts/oxlint-clean.test.sh \
                   ts/kit-checkout-ignored.test.sh; do
            echo "=== $t ==="; bash "$t" || fail=1
          done
          exit $fail
