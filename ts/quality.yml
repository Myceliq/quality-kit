##
# quality-kit stamped workflow — do not edit in the repo; change the kit.
# Drift gate first (cheap, unforgeable), then the exact same `validate`
# command agents run locally. Spec: cockpit docs/specs/2026-07-17-*.md
##
name: Quality

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read kit pin
        id: kit
        run: echo "version=$(python3 -c "import json;print(json.load(open('.quality-kit.json'))['version'])")" >> "$GITHUB_OUTPUT"

      # Fork-PR note: fork-originated pull_request runs receive no secrets, so
      # this checkout — and with it the drift gate — fails CLOSED on fork PRs.
      # Deliberate: fleet repos are single-operator private repos; PRs originate
      # from same-repo branches, which do receive secrets. Do not add a fork
      # skip — skipping the drift gate would fail OPEN.
      - name: Checkout quality-kit at pinned version
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: thomaslestum/cockpit
          ref: quality-kit-v${{ steps.kit.outputs.version }}
          token: ${{ secrets.QUALITY_KIT_READ_TOKEN }}
          path: .quality-kit-src

      - name: Drift gate
        run: KIT_DIR="$PWD/.quality-kit-src/quality-kit" bash .quality-kit-src/quality-kit/bin/check-drift.sh .

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate
        run: npm run validate
