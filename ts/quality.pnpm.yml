##
# quality-kit stamped workflow, pnpm variant — do not edit in the repo; change
# the kit. stamp.sh picks this or quality.npm.yml from the detected manager,
# and check-drift.sh compares against the same one, so a repo cannot end up
# carrying CI for a manager it does not use.
# KEEP IN SYNC with quality.npm.yml: the two files must differ ONLY in the
# manager-specific lines (the install step and the setup-node cache key), and
# bin/stamp.test.sh fails the kit's own CI if they ever differ anywhere else —
# two byte-owned copies drift silently otherwise.
# Drift gate first (cheap, unforgeable), then the exact same `validate`
# command agents run locally. Spec: cockpit docs/specs/2026-07-17-*.md (private).
##
name: Quality

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read kit pin
        id: kit
        run: echo "version=$(python3 -c "import json;print(json.load(open('.quality-kit.json'))['version'])")" >> "$GITHUB_OUTPUT"

      # The kit is a PUBLIC repo, so this checkout needs no token — and it works
      # on fork PRs, which receive no secrets. Until v0.4.0 it pointed at the
      # private cockpit repo and every stamped repo needed its own hand-minted
      # fine-grained PAT: a workflow's built-in GITHUB_TOKEN cannot check out a
      # different private repo, and GitHub has no API for minting PATs. That
      # per-repo manual step was the binding constraint on fleet-wide adoption.
      # Making the kit public removed it outright — do not reintroduce a token.
      - name: Checkout quality-kit at pinned version
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Myceliq/quality-kit
          ref: quality-kit-v${{ steps.kit.outputs.version }}
          path: .quality-kit-src

      - name: Drift gate
        run: KIT_DIR="$PWD/.quality-kit-src" bash .quality-kit-src/bin/check-drift.sh .

      # Drift proves the stamped files ARE the pinned ones. It does not prove they
      # WORK here. The kit's own CI proves they work in the kit's CI image — not in
      # this repo's image, and not in the factory gate container, which injects
      # FACTORY_GATE and once silently ungated a suite for a reason unrelated to the
      # code under test. Running the pinned checkout's own suites here closes that
      # gap: pinned gates, and they function on this runner. quality-kit#22.
      # Before install on purpose — it needs only bash, git and python3, so a red
      # kit is reported without spending an install first. The ts/*.test.sh suites
      # SKIP without OXLINT_BIN rather than passing silently.
      #
      # The git identity is set for the same reason the kit's own tests.yml sets it:
      # two fixture commits in hooks/hooks.test.sh do not pass `-c user.name/-c
      # user.email` inline the way every sibling suite does, and a GitHub runner has
      # no global identity and a domainless hostname, so git cannot auto-detect one.
      # Measured with an empty HOME: the commit dies with "unable to auto-detect
      # email address" — and the suite still reports ALL PASS, which is the worse
      # half. Supplying the identity here means these suites test what they claim
      # rather than running against a repo that was never built.
      - name: Kit self-test
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
          bash .quality-kit-src/bin/selftest.sh

      # pnpm is not on the runner image. Corepack ships with Node, so enabling it
      # costs no third-party action and no new pinned SHA. It has to run BEFORE
      # setup-node: `cache: 'pnpm'` shells out to `pnpm store path` to find the
      # store it should restore, and that needs pnpm already resolvable.
      # WHICH pnpm: corepack uses package.json `packageManager` when the repo
      # declares one, and otherwise resolves `latest`. That distinction is load
      # bearing, because pnpm >= 9 REFUSES a lockfileVersion 6 lockfile outright
      # (ERR_PNPM_LOCKFILE_BREAKING_CHANGE — measured with pnpm 11.9.0 against a
      # lockfile written by pnpm 8.15.9). A repo still on the pnpm 8 lockfile
      # format therefore has to declare an EXACT pnpm 8 version, e.g.
      # `"packageManager": "pnpm@8.15.9"`, or this step resolves a pnpm that
      # cannot read its lockfile. Exact, not a range: corepack rejects
      # `pnpm@8.x` with "Invalid package manager specification in package.json
      # (pnpm@8.x); expected a semver version" (measured, corepack 0.35.0).
      # That requirement is ENFORCED at stamp time, not merely documented:
      # stamp.sh refuses a pnpm repo whose declared (or `latest`) pnpm could not
      # read its committed lockfile generation, in either direction, before it
      # writes anything — so no repo reaches this step already knowing its
      # install cannot work, which is what quality-kit#7 is about. It checks
      # what is checkable offline; a version that does not exist or a wrong
      # integrity digest still fails HERE, loudly, on the first run.
      # ponytail: no pin of the kit's own — a kit-wide pnpm version would be
      # wrong for one of the two lockfile generations whichever one it named.
      # Upgrade path: have stamp.sh write `packageManager` (quality-kit#7 part 4),
      # which makes the CI pnpm version diff-visible in the repo like everything
      # else the kit pins.
      - name: Enable pnpm
        run: corepack enable pnpm

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Drift ratchet (burn-down counts)
        run: KIT_DIR="$PWD/.quality-kit-src" bash .quality-kit-src/bin/check-drift.sh . --ratchet

      - name: Validate
        run: pnpm run validate
